[package]
name = "skillshard"
version = "0.3.1"
edition = "2021"

[lib]
name = "skillshard"
path = "src/lib.rs"

[[bin]]
name = "skillshard"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# The headless UI harness: render real components, dispatch events, assert state.
gpui-kit = { version = "0.6", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
